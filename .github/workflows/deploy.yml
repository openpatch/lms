name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  partykit:
    name: Deploy PartyKit server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy to PartyKit
        run: npx partykit deploy
        env:
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}

      - name: Resolve server URL
        id: server
        run: |
          url="${{ vars.VITE_PARTYKIT_HOST }}"
          if [ -z "$url" ]; then
            url="lernen-mit-spass.mikebarkmin.partykit.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  build:
    name: Build static site
    needs: partykit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/configure-pages@v5
        id: pages

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_PARTYKIT_HOST: ${{ needs.partykit.outputs.server.url }}

      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
