name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to the server
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check games
        run: pnpm check:games

      - name: Check server
        run: pnpm check:server

      - name: Build
        # The client talks to the host it is served from, so no server URL needed.
        run: pnpm run build

      - name: Add deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload client and server
        run: |
          rsync -az --delete dist/ \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/srv/lms/dist/"
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude data --exclude .git \
            server shared scripts package.json pnpm-lock.yaml tsconfig*.json \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/srv/lms/"

      - name: Install dependencies and restart
        run: |
          ssh "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            'cd /srv/lms && pnpm install --prod --frozen-lockfile && sudo systemctl restart lms'

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.DEPLOY_HOST }}/parties/health" > /dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "server did not come back healthy"; exit 1
