# /etc/nginx/sites-available/lms.openpatch.org
#
# nginx serves the built client from disk and proxies only the game server's
# endpoints to Node. Certificates come from certbot (see deploy/README.md).

# WebSockets need this map; without it $connection_upgrade is empty and the
# upgrade never happens. Put it in the http block — /etc/nginx/nginx.conf or a
# snippet in conf.d — not inside server {}.
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lms.openpatch.org;

    ssl_certificate     /etc/letsencrypt/live/lms.openpatch.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.openpatch.org/privkey.pem;

    root /home/openpatch/projects/lms/dist;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The game server: sign-in, opening a lobby, and the gameplay WebSocket.
    location /parties/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A lobby can sit quiet for a long time — between rounds, or while the
        # teacher explains something. nginx closes an idle proxied connection
        # after 60s by default, which would drop every socket in the room.
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;

        # Gameplay messages are small and latency matters more than batching.
        proxy_buffering off;
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name lms.openpatch.org;
    return 301 https://$host$request_uri;
}
